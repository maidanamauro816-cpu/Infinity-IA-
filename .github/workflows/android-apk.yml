name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: npm install
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --non-interactive
      - name: Build standalone release APK (bundles JavaScript)
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: sumo-android-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
